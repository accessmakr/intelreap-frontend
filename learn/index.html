<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Routing | IntelReap</title>
    
    <!-- Primary Routing Protocol: Meta Refresh -->
    <meta http-equiv="refresh" content="0; url=https://intelreap.com/">
    
    <!-- SEO Protection: Prevent indexing of the routing node -->
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://intelreap.com/">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: #0a0f1a;
            color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .spinner {
            border-top-color: #10b981; /* Emerald 500 */
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>

    <!-- Secondary Routing Protocol: JavaScript Fallback -->
    <script>
        // Use replace() so the routing node isn't saved in the browser's back button history
        window.location.replace("https://intelreap.com/");
    </script>
</head>
<body class="flex items-center justify-center min-h-screen p-4">
    <!-- Visual Fallback (Only visible if routing is artificially delayed by client) -->
    <div class="text-center max-w-md w-full">
        <div class="inline-block w-8 h-8 border-2 border-slate-700 rounded-full spinner mb-6"></div>
        <h1 class="text-xl font-light tracking-wide text-slate-200 mb-2">Routing to IntelReap Core</h1>
        <p class="text-xs text-slate-500 uppercase tracking-widest">
            If you are not redirected automatically, <a href="https://intelreap.com/" class="text-emerald-500 hover:text-emerald-400 transition-colors">click here</a>.
        </p>
    </div>
</body>
</html>
