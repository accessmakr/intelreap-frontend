# ─────────────────────────────────────────
# INTELREAP NETLIFY CONFIGURATION
# Routing, redirects, headers
# ─────────────────────────────────────────

[build]
  publish = "."

# ─────────────────────────────────────────
# REDIRECTS
# ─────────────────────────────────────────

# intelligence.html → root (safety redirect)
# Handles all old references and bookmarks
[[redirects]]
  from = "/intelligence.html"
  to = "/"
  status = 301
  force = true

# ─────────────────────────────────────────
# OLD SITE IDENTITY — 410 GONE
# This domain previously hosted a video
# downloader tool. Those paths must return
# 410 Gone, never a 301 redirect to the
# homepage — a redirect implies the content
# moved, which would incorrectly transfer
# old intent/backlinks onto this unrelated
# site. 410 tells Google the old resource
# is permanently and deliberately removed.
# ─────────────────────────────────────────

[[redirects]]
  from = "/download"
  to = "/410.html"
  status = 410

[[redirects]]
  from = "/download/*"
  to = "/410.html"
  status = 410

[[redirects]]
  from = "/video"
  to = "/410.html"
  status = 410

[[redirects]]
  from = "/video/*"
  to = "/410.html"
  status = 410

[[redirects]]
  from = "/yt"
  to = "/410.html"
  status = 410

[[redirects]]
  from = "/yt/*"
  to = "/410.html"
  status = 410

[[redirects]]
  from = "/convert"
  to = "/410.html"
  status = 410

[[redirects]]
  from = "/convert/*"
  to = "/410.html"
  status = 410

[[redirects]]
  from = "/get"
  to = "/410.html"
  status = 410

[[redirects]]
  from = "/get/*"
  to = "/410.html"
  status = 410

[[redirects]]
  from = "/fetch"
  to = "/410.html"
  status = 410

[[redirects]]
  from = "/fetch/*"
  to = "/410.html"
  status = 410

# Clean URL support (optional)
# Allows intelreap.com/intelligence/security
# without the .html extension
[[redirects]]
  from = "/intelligence/:page"
  to = "/intelligence/:page.html"
  status = 200

# ─────────────────────────────────────────
# SECURITY HEADERS
# Applied to all pages
# ─────────────────────────────────────────

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

# ─────────────────────────────────────────
# CACHE HEADERS
# Static assets cached aggressively
# HTML pages not cached (always fresh)
# ─────────────────────────────────────────

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache"
