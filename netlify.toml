# ─────────────────────────────────────────
# INTELREAP NETLIFY CONFIGURATION
# Routing, redirects, headers
# ─────────────────────────────────────────

[build]
  publish = "."

# ─────────────────────────────────────────
# REDIRECTS
# ─────────────────────────────────────────

# intelligence.html → root (safety redirect)
# Handles all old references and bookmarks
[[redirects]]
  from = "/intelligence.html"
  to = "/"
  status = 301
  force = true

# ─────────────────────────────────────────
# OLD SITE IDENTITY — 410 GONE
# This domain previously hosted a video
# downloader tool. Those paths must return
# 410 Gone, never a 301 redirect to the
# homepage — a redirect implies the content
# moved, which would incorrectly transfer
# old intent/backlinks onto this unrelated
# site. 410 tells Google the old resource
# is permanently and deliberately removed.
# ─────────────────────────────────────────

[[redirects]]
  from = "/download"
  to = "/410.html"
  status = 410

[[redirects]]
  from = "/download/*"
  to = "/410.html"
  status = 410

[[redirects]]
  from = "/video"
  to = "/410.html"
  status = 410

[[redirects]]
  from = "/video/*"
  to = "/410.html"
  status = 410

[[redirects]]
  from = "/yt"
  to = "/410.html"
  status = 410

[[redirects]]
  from = "/yt/*"
  to = "/410.html"
  status = 410

[[redirects]]
  from = "/convert"
  to = "/410.html"
  status = 410

[[redirects]]
  from = "/convert/*"
  to = "/410.html"
  status = 410

[[redirects]]
  from = "/get"
  to = "/410.html"
  status = 410

[[redirects]]
  from = "/get/*"
  to = "/410.html"
  status = 410

[[redirects]]
  from = "/fetch"
  to = "/410.html"
  status = 410

[[redirects]]
  from = "/fetch/*"
  to = "/410.html"
  status = 410

[[redirects]]
  from = "/tools"
  to = "/410.html"
  status = 410

[[redirects]]
  from = "/tools/*"
  to = "/410.html"
  status = 410

[[redirects]]
  from = "/guides/how-to-find-downloads-on-iphone"
  to = "/410.html"
  status = 410

