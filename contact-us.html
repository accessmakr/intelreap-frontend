<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | IntelReap Premium Support</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100">
    <header class="border-b border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-5 flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-3">
                <span class="text-2xl font-bold tracking-tighter">Intel<span class="text-blue-600">Reap</span></span>
            </a>
            <div id="master-nav-dock" class="flex items-center"></div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-20">
        <div class="grid lg:grid-cols-2 gap-16">
            <div>
                <h1 class="text-5xl font-extrabold mb-6 tracking-tight">Connect with us.</h1>
                <p class="text-xl text-slate-600 mb-8">Our team is available for technical support and business inquiries.</p>
                <div class="space-y-6 font-medium">
                    <p class="flex items-center gap-4">📍 <span>100 McKinsey Ave, Suite 400</span></p>
                    <p class="flex items-center gap-4">⏰ <span>Mon-Fri: 9:00 AM - 5:00 PM EST</span></p>
                </div>
            </div>

            <section class="bg-white dark:bg-slate-900 p-10 rounded-3xl shadow-2xl border border-slate-100 dark:border-slate-800">
                <form id="premium-contact-form" class="space-y-6">
                    <input type="text" placeholder="Name" required class="w-full p-4 rounded-xl border border-slate-200 dark:bg-slate-800 outline-none focus:border-emerald-500">
                    <input type="email" placeholder="Email" required class="w-full p-4 rounded-xl border border-slate-200 dark:bg-slate-800 outline-none focus:border-emerald-500">
                    <textarea placeholder="Message" required rows="6" class="w-full p-4 rounded-xl border border-slate-200 dark:bg-slate-800 outline-none focus:border-emerald-500"></textarea>
                    <button type="submit" class="w-full py-5 bg-slate-900 dark:bg-white dark:text-slate-900 text-white font-bold rounded-xl text-lg hover:scale-[1.01] transition-transform">Send Secure Message</button>
                </form>
            </section>
        </div>
    </main>

    <footer class="bg-slate-900 py-10 text-center text-slate-400">
        <div id="footer-social-links" class="mb-6 flex justify-center gap-6">
            <a href="https://twitter.com">Twitter</a> <a href="https://facebook.com">Facebook</a>
        </div>
        <p>&copy; <span class="dynamic-year"></span> IntelReap. All Rights Reserved.</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.dynamic-year').forEach(el => el.textContent = new Date().getFullYear());
            document.getElementById('premium-contact-form').addEventListener('submit', (e) => {
                e.preventDefault();
                alert("Success! Your inquiry has been routed to accessmakr@gmail.com.");
                e.target.reset();
            });
        });
    </script>
    <script defer src="../js/menu-system.js"></script>
</body>
</html>
