<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do Not Sell My Personal Information | IntelReap</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100">
    <!-- Layout remains consistent with DMCA but content changes -->
    <header class="border-b border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-5 flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-3">
                <span class="text-2xl font-bold tracking-tighter">Intel<span class="text-blue-600">Reap</span></span>
            </a>
            <div id="master-nav-dock" class="flex items-center"></div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-6 py-20 min-h-screen">
        <h1 class="text-4xl font-extrabold mb-6">Your Privacy Rights (CCPA/CPRA)</h1>
        <p class="text-lg mb-10 text-slate-600 dark:text-slate-400">IntelReap does not sell your personal data to third parties. However, you have the right to formally opt-out of any future "sales" or "sharing" as defined by law.</p>

        <section class="bg-white dark:bg-slate-900 p-8 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm">
            <h2 class="text-2xl font-bold mb-4">Submit a Request</h2>
            <form id="premium-contact-form" class="space-y-6">
                <input type="text" placeholder="Your Full Name" required class="w-full p-4 rounded-xl border border-slate-200 dark:bg-slate-800">
                <input type="email" placeholder="Email Address" required class="w-full p-4 rounded-xl border border-slate-200 dark:bg-slate-800">
                <button type="submit" class="w-full py-4 bg-blue-600 text-white font-bold rounded-xl">Exercise My Rights</button>
            </form>
        </section>
    </main>

    <footer class="bg-slate-900 text-slate-400 py-12 px-6">
        <div class="max-w-7xl mx-auto text-center">
            <p>&copy; <span class="dynamic-year"></span> IntelReap. Fully Contained System.</p>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.dynamic-year').forEach(el => el.textContent = new Date().getFullYear());
            document.getElementById('premium-contact-form').addEventListener('submit', (e) => {
                e.preventDefault();
                alert("Privacy request received. Sent to accessmakr@gmail.com.");
            });
        });
    </script>
    <script defer src="../js/menu-system.js"></script>
</body>
</html>
